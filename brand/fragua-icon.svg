<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Fragua">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#241C18"/>
      <stop offset="100%" stop-color="#141414"/>
    </radialGradient>
    <linearGradient id="flame" x1="24" y1="4" x2="24" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="45%" stop-color="#F27636"/>
      <stop offset="100%" stop-color="#C7371A"/>
    </linearGradient>
    <linearGradient id="anvil" x1="4" y1="24" x2="44" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E4E4E4"/>
      <stop offset="45%" stop-color="#9A9A9A"/>
      <stop offset="100%" stop-color="#4A4A4A"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="48" height="48" rx="11" fill="url(#bgGlow)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="10.5" stroke="#3A2E28"/>

  <!-- Yunque: gris ceniza con gradiente metalico, perfil reconocible. -->
  <path d="M4 28 12 24 32 24 37 27.5 32 30 24 30 24 34 31 34 31 39 9 39 9 34 16 34 16 30 8 30Z"
        fill="url(#anvil)"/>
  <!-- Filo de luz sobre la cara del yunque: el toque que lo lee como metal
       pulido en vez de un gris plano. -->
  <path d="M12 24.6 32 24.6 36.3 27.6" stroke="#F2F2F2" stroke-width="0.9" stroke-linecap="round" opacity="0.7" fill="none"/>

  <!-- Llama: gradiente ambar a rojo brasa, con resplandor suave. -->
  <path d="M23 4c.8 3 3 4.9 4.6 6.9C29.7 13.3 31 15.8 31 18.6c0 5-3.9 9-8.7 9s-8.7-3.7-8.7-8.6c0-2.9 1.4-5 3-6.8.2 1.7 1 2.9 2.1 3.6-.2-4.1 1.4-8 4.3-11.8z"
        fill="url(#flame)" filter="url(#glow)"/>
</svg>
